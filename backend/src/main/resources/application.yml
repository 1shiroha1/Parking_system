server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/parking_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

parking:
  jwt:
    secret: please-change-this-secret-to-a-long-random-string
    expire-seconds: 2592000 # 30天

app:
  cors:
    allow-origins: "http://localhost:5173,http://127.0.0.1:5173"

